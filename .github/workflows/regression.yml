name: Son Parsel regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rules-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/regression.cjs
